# Keeps two things that are pinned from going stale: the GitHub Actions (every one is
# pinned to a commit, so nothing else will move them) and the Python requirements. A pin that
# nothing updates is how a fixed vulnerability stays in the build. (A third entry, for the web
# client's npm packages, went with the web client on 2026-11-26: DECISIONS.md.)
#
# At most one pull request per ecosystem is open at a time, and it carries every update that
# ecosystem has, once a month. The first version of this file said "one pull request per
# ecosystem at a time" while allowing 2, 3 and 3, and Dependabot opened ten at once, a branch
# each (4, 4 and 2): a limit alone did not hold. A group is one pull request, so each
# ecosystem has one group that takes every package, and the limit of 1 is a second guard.
# tests/test_dependency_policy.py holds this file to that.
#
# Turning this off is a decision, not a tidy-up: DECISIONS.md ("a pin has a reason") and that
# test both name this file. Security fixes follow separate GitHub settings, not this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # requirements.txt is written as ranges: a minimum the app is developed against and a ceiling at the next major
    # release. Dependabot's default for an app raises every minimum to the newest release, which is how #34 came to ask
    # for numpy>=2.5.5, a release that needs Python 3.12 when the readme supports 3.11. `increase-if-necessary` leaves a
    # requirement alone when its range already allows the new release and changes it only when it does not, the one case
    # that needs a person to decide. (`widen` would suit ranges better, but GitHub's own check of this file refuses it
    # for pip: only lockfile-only, auto, increase and increase-if-necessary are accepted, and tests/test_dependency_policy.py
    # holds the value to that list.) What it proposes is then installed on every Python the launcher accepts and the whole
    # suite is run on it (.github/workflows/install-check.yml).
    versioning-strategy: increase-if-necessary
    ignore:
      # Qt 6.12.0 segfaults while constructing QAudioOutput on a machine with no audio backend (measured here, and written
      # beside the ceiling in requirements.txt). The ceiling stays below 6.12 until that is re-tested, by hand, so
      # Dependabot is told to ignore PyQt6 6.12 and up. Lift the two together: a test holds the numbers to each other.
      # The first version of this rule named only minor and major releases (`update-types`) and did nothing:
      # Dependabot's first pull request under it (#39, 2026-11-25) raised the ceiling to <6.13 all the same. Every
      # requirement here is a range, and a rule on update types did not hold for one; why is not known. The versions are
      # named instead. A bare rule would ignore every version, and GitHub's documentation says a rule on versions
      # reaches security updates too, so this one stops only what the ceiling forbids: a Qt security release that
      # needs 6.12 or later gets no pull request and has to be noticed by hand. tests/test_dependency_policy.py also
      # refuses a rule on update types for any requirement that is not an exact pin.
      - dependency-name: "PyQt6"
        versions: [">=6.12"]
    groups:
      python-all:
        patterns: ["*"]
