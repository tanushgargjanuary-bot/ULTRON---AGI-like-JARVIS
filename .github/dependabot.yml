# Keeps three things that are pinned from going stale: the GitHub Actions (every one is
# pinned to a commit, so nothing else will move them), the Python requirements, and the web
# app's packages (package-lock.json). A pin that nothing updates is how a fixed vulnerability
# stays in the build.
#
# At most one pull request per ecosystem is open at a time, and it carries every update that
# ecosystem has, once a month. The first version of this file said "one pull request per
# ecosystem at a time" while allowing 2, 3 and 3, and Dependabot opened ten at once, a branch
# each (4, 4 and 2): a limit alone did not hold. A group is one pull request, so each
# ecosystem has one group that takes every package, and the limit of 1 is a second guard.
# tests/test_dependency_policy.py holds this file to that.
#
# Turning this off is a decision, not a tidy-up: DECISIONS.md ("a pin has a reason") and that
# test both name this file. Security fixes follow separate GitHub settings, not this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # requirements.txt is written as ranges: a minimum the app is developed against and a ceiling at the next major
    # release. Dependabot's default for an app raises every minimum to the newest release, which is how #34 came to ask
    # for numpy>=2.5.5, a release that needs Python 3.12 when the readme supports 3.11. `widen` leaves a requirement alone
    # when its range already allows the new release and only raises a ceiling when it has to. What it proposes is then
    # installed on every Python the launcher accepts and the whole suite is run on it (.github/workflows/install-check.yml).
    versioning-strategy: widen
    ignore:
      # Qt 6.12.0 segfaults while constructing QAudioOutput on a machine with no audio backend (measured here, and written
      # beside the ceiling in requirements.txt). The ceiling stays below 6.12 until that is re-tested, by hand.
      - dependency-name: "PyQt6"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      python-all:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      webapp-all:
        patterns: ["*"]
