name: Reviewdog — Python static review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: reviewdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruff:
    name: reviewdog / Ruff (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.3

      - name: Report Ruff findings on changed lines
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          ruff check . --select E4,E7,E9,F,B,BLE001,S --output-format=rdjson > "${RUNNER_TEMP}/ruff.rdjson" || true
          reviewdog \
            -f=rdjson \
            -name="Ruff (changed lines)" \
            -reporter=github-pr-check \
            -filter-mode=added \
            -level=warning \
            < "${RUNNER_TEMP}/ruff.rdjson"
