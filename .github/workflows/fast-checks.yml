name: fast branch checks

on:
  # This lane runs for every branch push, including main.
  push:
    branches: ['**']
  # Fork branch updates cannot trigger a push in this repository. Their PR
  # events therefore run the same read-only fast gate.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast offline gate
    if: >-
      (github.event_name != 'push' || github.event.deleted != true) &&
      (github.event_name != 'pull_request' ||
       github.event.action != 'synchronize' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the focused static checker
        run: python -m pip install --disable-pip-version-check "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Check the exact change range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            CHECK_SHA="$HEAD_SHA"
          else
            CHECK_SHA="$HEAD_SHA"
            if [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              BASE_SHA="$PUSH_BEFORE"
            else
              git fetch --no-tags origin \
                "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
              BASE_SHA="$(git merge-base "$CHECK_SHA" "origin/${DEFAULT_BRANCH}")"
            fi
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${CHECK_SHA}^{commit}"
          git diff --check "$BASE_SHA" "$CHECK_SHA"

          # Ruff, rules E4,E7,E9,F, on every changed Python file - compared with the same
          # file at BASE_SHA, so a change fails for the findings it ADDS and not for the ones
          # the file already had (ui.py has 97). Exits 2, and so fails this step, when ruff
          # or git cannot be run. See scripts/lint_ratchet.py.
          python scripts/lint_ratchet.py --base "$BASE_SHA"

      - name: Install the stress suite's small import dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3" "jsonschema>=4.23,<5"

      - name: Run fast offline regressions and edge cases
        run: python scripts/fast_verify.py

      - name: Verify the generated module and test map
        shell: bash
        run: |
          set -euo pipefail
          python scripts/map.py --write > "$RUNNER_TEMP/ultron-map-output.txt"
          if ! git diff --quiet -- docs/MAP.md; then
            echo "docs/MAP.md is stale. Run python scripts/map.py --write and commit the result."
            python -c 'import base64; from pathlib import Path; value=base64.b64encode(Path("docs/MAP.md").read_bytes()).decode(); [print(f"ULTRON_MAP_B64_{i // 3000:03d}={value[i:i + 3000]}") for i in range(0, len(value), 3000)]'
            exit 1
          fi

      - name: Record the fast-gate result
        if: always()
        shell: bash
        run: |
          {
            echo "### Fast branch gate"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- This is the fast offline preflight. The full Linux/Windows gate remains separate."
          } >> "$GITHUB_STEP_SUMMARY"
