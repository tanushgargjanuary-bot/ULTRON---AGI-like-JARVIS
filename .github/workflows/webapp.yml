name: ULTRON Web checks

on:
  push:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"

permissions:
  contents: read

concurrency:
  group: ultron-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # `npm ci` installs exactly what package-lock.json records and fails when the two
      # files disagree. `npm install` re-resolved every ^range on each run, so a green
      # build on Monday said nothing about the same commit on Tuesday.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
