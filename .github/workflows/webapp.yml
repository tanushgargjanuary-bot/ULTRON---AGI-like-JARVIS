name: ULTRON Web checks

on:
  push:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"

permissions:
  contents: read

concurrency:
  group: ultron-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # `npm ci` installs exactly what package-lock.json records and fails when the two
      # files disagree. `npm install` re-resolved every ^range on each run, so a green
      # build on Monday said nothing about the same commit on Tuesday.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
