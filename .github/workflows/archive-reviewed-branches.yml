name: Archive reviewed branch tips

on:
  # Promotion push automatically creates recovery tags; it never deletes branches.
  push:
    branches:
      - main
  # Deletion remains a separate, manually confirmed run from main.
  workflow_dispatch:
    inputs:
      delete_branches:
        description: "Delete archived branch refs after tag verification"
        required: false
        type: boolean
        default: false
      confirm_delete:
        description: 'Type DELETE ARCHIVED BRANCHES to authorise deletion'
        required: false
        type: string
      confirm_archive_tags:
        description: 'Type ARCHIVE TAGS PROTECTED after a tag ruleset protects archive/**/*'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ultron-reviewed-branch-cleanup
  cancel-in-progress: false

jobs:
  archive-reviewed-tips:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Archive exact reviewed tips and optionally delete their branch refs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // workflow_dispatch inputs are event payload data, not action inputs.
            const dispatchInputs = context.payload.inputs || {};
            const deleteValue = dispatchInputs.delete_branches;
            const deleteBranches = deleteValue === true || String(deleteValue).toLowerCase() === 'true';
            const confirmation = String(dispatchInputs.confirm_delete || '');
            const tagProtectionConfirmation = String(dispatchInputs.confirm_archive_tags || '');

            if (context.ref !== 'refs/heads/main') {
              throw new Error('Run this workflow from main only.');
            }
            if (deleteBranches && confirmation !== 'DELETE ARCHIVED BRANCHES') {
              throw new Error('Deletion refused: the confirmation phrase does not match.');
            }
            if (deleteBranches && tagProtectionConfirmation !== 'ARCHIVE TAGS PROTECTED') {
              throw new Error('Deletion refused: first protect the archive/**/* tag-name pattern against updates and deletion with a GitHub ruleset, then attest with the exact phrase.');
            }

            // Never trust a typed attestation by itself. Verify the live repository ruleset
            // before any archive or deletion operation. This endpoint is readable on public repos.
            if (deleteBranches) {
              const summaries = await github.paginate(
                'GET /repos/{owner}/{repo}/rulesets',
                { owner, repo, per_page: 100, includes_parents: false, targets: 'tag' },
              );
              const ruleSets = [];
              for (const summary of summaries) {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',
                  { owner, repo, ruleset_id: summary.id },
                );
                ruleSets.push(response.data);
              }

              const protectsArchiveTags = ruleSets.some((ruleSet) => {
                const includes = ruleSet.conditions?.ref_name?.include || [];
                const excludes = ruleSet.conditions?.ref_name?.exclude || [];
                const ruleTypes = new Set((ruleSet.rules || []).map((rule) => rule.type));
                const bypassActors = ruleSet.bypass_actors || [];
                return ruleSet.target === 'tag' &&
                  ruleSet.enforcement === 'active' &&
                  includes.includes('refs/tags/archive/**/*') &&
                  excludes.length === 0 &&
                  ruleTypes.has('update') &&
                  ruleTypes.has('deletion') &&
                  !ruleTypes.has('creation') &&
                  bypassActors.length === 0;
              });

              if (!protectsArchiveTags) {
                throw new Error(
                  'Deletion refused: no Active tag ruleset was found that protects refs/tags/archive/**/* against updates and deletions, allows tag creation, and has no bypass actors.',
                );
              }
            }

            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            let candidateSha;
            try {
              const candidateRef = await github.rest.git.getRef({
                owner, repo, ref: 'heads/ultron/curated-promotion-2026-11',
              });
              candidateSha = candidateRef.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              // Branch cleanup intentionally deletes the candidate branch. Once it is gone,
              // use the protected exact-SHA archive tag so later push-triggered archive-only
              // runs remain idempotent. Refuse any unexpected target.
              const candidateArchiveRef = await github.rest.git.getRef({
                owner, repo,
                ref: 'tags/archive/2026-11-10/ultron-curated-promotion-2026-11-bd4b43d1',
              });
              candidateSha = candidateArchiveRef.data.object.sha;
              if (candidateSha !== 'bd4b43d16fdf27b495209678ed72b41f21408d7c') {
                throw new Error('Refusing cleanup: curated candidate recovery tag does not point to the reviewed promotion SHA.');
              }
            }
            const mainSha = mainRef.data.object.sha;
            const ancestry = await github.rest.repos.compareCommits({
              owner, repo, base: candidateSha, head: mainSha,
            });
            if (ancestry.data.behind_by !== 0) {
              throw new Error('Refusing cleanup: main does not contain the current curated candidate tip.');
            }

            // These are the exact branch tips measured during the review on 2026-11-10.
            // If any branch moves, the workflow stops before creating archive tags.
            const entries = [
              { name: 'ArenaAi', sha: '8f4803b8812e4cae1e79755381eda69f5b76ee81' },
              { name: 'antigravity', sha: 'b8e9334484bb214fd1f18021eade35c62ba5329b' },
              { name: 'arena/4c973188-ultron-agi-like-jarvis', sha: '8b20ceff3421add70b65cc4eacca1dac1f3b5b36' },
              { name: 'chatgpt', sha: 'c98ea0ff81a440ba4b2f56b1aef0f726384f521d' },
              { name: 'code-quality-and-security-improvements-af08a', sha: 'bc65a2746d5a75232ff3ecb9a7ac6b57b87f8420' },
              { name: 'feature/web-companion-mvp', sha: '309529147821728554896f84141333dd9fb512e8' },
              { name: 'feature/web-mvp-auth', sha: 'a862f7650ddc36ac04d1178884d6802e2b3cb4c1' },
              { name: 'integration/best-of-all-2026-11-09', sha: '5118dede0ca4c29206a24a08ec9f9ae6699011f5' },
              { name: 'ultron/consolidation-2026-11', sha: 'e058f26d4eff7f54ba896a3b8c307f5bc1e0aa7a' },
              // These two branches were merged through reviewed PRs on 2026-11-10.
              // Preserve their exact pre-squash tips before the owner deletes the refs.
              { name: 'docs/repository-doc-audit-2026-11-10', sha: '9074b986c9379ff2b2f320916616763a735df972' },
              { name: 'ci/fast-branch-gate', sha: 'e0072889ca333f5b8193f7d85b4ef912bf4aa10d' },
              // The promoted candidate can receive later reviewed commits. Its current tip
              // is archived dynamically, after verifying that main contains that exact tip.
              { name: 'ultron/curated-promotion-2026-11', sha: candidateSha },
            ];

            const getRefOrNull = async (ref) => {
              try {
                return await github.rest.git.getRef({ owner, repo, ref });
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            const tagFor = (entry) => {
              const slug = entry.name.toLowerCase().replace(/\//g, '-').replace(/[^a-z0-9._-]/g, '-');
              return 'archive/2026-11-10/' + slug + '-' + entry.sha.slice(0, 8);
            };

            // Preflight every source ref and every deterministic archive tag first.
            for (const entry of entries) {
              const branchRef = await getRefOrNull('heads/' + entry.name);
              if (branchRef && branchRef.data.object.sha !== entry.sha) {
                throw new Error('Refusing cleanup: ' + entry.name + ' moved to ' + branchRef.data.object.sha + '; expected ' + entry.sha + '.');
              }
              const existingTag = await getRefOrNull('tags/' + tagFor(entry));
              if (existingTag && existingTag.data.object.sha !== entry.sha) {
                throw new Error('Refusing cleanup: archive tag already points elsewhere: ' + tagFor(entry));
              }
            }

            // Create all archive tags before considering deletion. Tags point to exact commits.
            for (const entry of entries) {
              const tagName = tagFor(entry);
              const existing = await getRefOrNull('tags/' + tagName);
              if (!existing) {
                await github.rest.git.createRef({
                  owner, repo, ref: 'refs/tags/' + tagName, sha: entry.sha,
                });
              }
              const verified = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + tagName });
              if (verified.data.object.sha !== entry.sha) {
                throw new Error('Archive tag verification failed: ' + tagName);
              }
            }

            const archived = entries.map((entry) => ({ ...entry, tag: tagFor(entry) }));
            if (!deleteBranches) {
              await core.summary
                .addHeading('Archive complete — no branches deleted')
                .addTable([
                  [{ data: 'Branch', header: true }, { data: 'Archived commit', header: true }, { data: 'Tag', header: true }],
                  ...archived.map((entry) => [entry.name, entry.sha, entry.tag]),
                ])
                .addList(['Verified archive tags: ' + archived.length, 'All branch refs were preserved.', 'main was not changed.'])
                .write();
              return;
            }

            // A branch used by an open PR is never deleted by this workflow.
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const activeHeads = new Set(openPulls
              .filter((pull) => pull.head && pull.head.repo && pull.head.repo.full_name === owner + '/' + repo)
              .map((pull) => pull.head.ref));
            const deleted = [];
            const skipped = [];

            for (const entry of archived) {
              if (entry.name === 'main') {
                throw new Error('Safety guard: main must never be in the deletion list.');
              }
              if (activeHeads.has(entry.name)) {
                skipped.push({ name: entry.name, reason: 'open pull request' });
                continue;
              }
              const tagRef = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + entry.tag });
              if (tagRef.data.object.sha !== entry.sha) {
                skipped.push({ name: entry.name, reason: 'archive tag no longer matches' });
                continue;
              }
              const branchRef = await getRefOrNull('heads/' + entry.name);
              if (!branchRef) {
                skipped.push({ name: entry.name, reason: 'branch already absent; archive tag retained' });
                continue;
              }
              if (branchRef.data.object.sha !== entry.sha) {
                skipped.push({ name: entry.name, reason: 'branch moved after archive preflight; retained' });
                continue;
              }
              // Recheck open PRs immediately before deleting this branch.
              const latestPulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              const nowActive = latestPulls.some((pull) => pull.head && pull.head.repo &&
                pull.head.repo.full_name === owner + '/' + repo && pull.head.ref === entry.name);
              if (nowActive) {
                skipped.push({ name: entry.name, reason: 'open pull request appeared during cleanup' });
                continue;
              }
              // The verified tag keeps the exact commit reachable before the branch ref is removed.
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + entry.name });
              deleted.push({ name: entry.name, sha: entry.sha, tag: entry.tag });
            }

            await core.summary
              .addHeading('Branch cleanup result')
              .addTable([
                [{ data: 'Deleted branch', header: true }, { data: 'Archived commit', header: true }, { data: 'Recovery tag', header: true }],
                ...deleted.map((entry) => [entry.name, entry.sha, entry.tag]),
              ])
              .addHeading('Preserved branches')
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Reason', header: true }],
                ...skipped.map((entry) => [entry.name, entry.reason]),
              ])
              .addList(['Deleted: ' + deleted.length, 'Skipped and preserved: ' + skipped.length, 'main was not changed or deleted.'])
              .write();

            if (skipped.length) {
              core.warning('Some branches were preserved. Review the workflow summary before another cleanup run.');
            }
