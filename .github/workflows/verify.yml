name: verify

# The cheapest unlock in this project. Until now nothing had ever run on Windows
# automatically, and twelve proof-gate claims said "PARTIAL — needs your machine".
# These two jobs are that machine.

on:
  # Test every branch. Permanent agent-specific branch allowlists become stale and
  # can make an untested branch look healthy.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux — suite and instruments
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt needs these even when it draws off-screen; without them the import
      # fails with "could not load the Qt platform plugin xcb".
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0 libfontconfig1

      # A deliberately LEAN set. requirements.txt carries OpenCV, Playwright,
      # FastAPI and the Google client libraries; installing all of that to run a
      # test suite makes every CI run slower and every red build harder to read.
      # These are the packages the suite actually imports.
      - name: Install the suite's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt6>=6.6,<6.12" "numpy>=1.24,<3" \
            "sounddevice>=0.4,<1" "google-genai>=2.8,<3" "httpx>=0.27,<1" \
            "mss>=9,<11" "psutil>=5.9,<8" "pillow>=10,<13" "requests>=2.31,<3" \
            "beautifulsoup4>=4.12,<5" "jsonschema>=4.23,<5" "cryptography>=42,<50"

      - name: Suite, self-checks, migration and mutation gates
        run: python scripts/verify.py

      # The numbers belong on the run page, not inside a zip. Until now a green
      # tick said "something passed"; the PROVEN / PARTIAL / FAILED counts, which
      # are the actual claim, lived in an artifact nobody opened.
      - name: Proof gate
        run: |
          mkdir -p verification
          python scripts/proof_gate.py --json verification/proof-gate.json 2>&1 | tee verification/proof-gate.txt
          {
            echo "### Proof gate — linux"
            echo '```'
            tail -n 20 verification/proof-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instrument report (never blocks; it reports what this box cannot answer)
        run: python scripts/verify_all.py || true
        continue-on-error: true

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-linux
          path: |
            verification/
            verification-results.txt
          if-no-files-found: warn

  windows:
    name: windows — the machine the claims are about
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the suite's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt6>=6.6,<6.12" "numpy>=1.24,<3" `
            "sounddevice>=0.4,<1" "google-genai>=2.8,<3" "httpx>=0.27,<1" `
            "mss>=9,<11" "psutil>=5.9,<8" "pillow>=10,<13" "requests>=2.31,<3" `
            "beautifulsoup4>=4.12,<5" "jsonschema>=4.23,<5" `
            "cryptography>=42,<50" "uiautomation" "pywinauto" "pyautogui" "pyperclip"

      # The job that can close the Windows claims: native DPI, a real window, the
      # accessibility tree, no console window flashing.
      #
      # `shell: bash`, deliberately. GitHub runs `run:` steps in PowerShell, whose
      # `$ErrorActionPreference = 'stop'` turns a native command's STDERR into a
      # step failure — and this suite writes tracebacks to stderr on purpose,
      # because the tests check that an error is reported as a sentence. The first
      # Windows run failed with byte-identical results to the passing Linux run,
      # which is what "the shell failed the step, not the code" looks like. Bash is
      # installed on every runner, and `tee` keeps the console in the artifact.
      - name: Native checks
        shell: bash
        run: |
          mkdir -p verification
          python scripts/verify_all.py --report verification/capabilities.json 2>&1 | tee verification/console-native.txt

      - name: Suite and self-checks
        shell: bash
        run: python scripts/verify.py 2>&1 | tee verification/console-suite.txt

      - name: Proof gate
        shell: bash
        run: |
          python scripts/proof_gate.py --json verification/proof-gate.json 2>&1 | tee verification/console-gate.txt
          {
            echo "### Proof gate — windows"
            echo '```'
            tail -n 20 verification/console-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-windows
          path: |
            verification/
            verification-results.txt
            log.txt
          if-no-files-found: warn
